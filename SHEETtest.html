<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPM - Professional Work Order System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #f3f4f6; }
        .input-card { @apply bg-white p-5 rounded-xl shadow-sm border border-gray-200; }
        .label-text { @apply block text-xs font-bold text-gray-500 uppercase mb-1; }
        .input-field { @apply w-full border-b border-gray-300 focus:border-blue-600 outline-none py-1 text-sm transition-colors; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-5xl mx-auto">
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">สร้างใบงานขนส่งสินค้า</h1>
                <p class="text-gray-500 text-sm">SPM Document System 2026 - Digital Form</p>
            </div>
            <button onclick="generatePDF()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg shadow-lg flex items-center gap-2">
                <span>🖨️</span> ออกใบงาน PDF (1 หน้า)
            </button>
        </div>

        <form id="docForm" class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="input-card">
                    <label class="label-text">เลขที่ใบงาน (RN NO.)</label>
                    <input type="text" id="rn_no" class="input-field" placeholder="RN20260513-XXX">
                </div>
                <div class="input-card">
                    <label class="label-text">วันที่ (Date)</label>
                    <input type="date" id="doc_date" class="input-field">
                </div>
                <div class="input-card">
                    <label class="label-text">หมายเลขตู้ (Container No.)</label>
                    <input type="text" id="container_no" class="input-field uppercase" placeholder="TCLU1234567">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="input-card">
                    <h3 class="text-blue-700 font-bold mb-3 border-b pb-2">SHIPPER (ผู้จัดส่ง)</h3>
                    <div class="space-y-3">
                        <input type="text" id="shipper_name" class="input-field font-bold" placeholder="ชื่อบริษัทผู้ส่ง">
                        <textarea id="shipper_addr" class="input-field text-xs" rows="2" placeholder="ที่อยู่ผู้ส่ง..."></textarea>
                    </div>
                </div>
                <div class="input-card">
                    <h3 class="text-blue-700 font-bold mb-3 border-b pb-2">CONSIGNEE (ผู้รับสินค้า)</h3>
                    <div class="space-y-3">
                        <input type="text" id="consignee_name" class="input-field font-bold" placeholder="ชื่อบริษัทผู้รับ">
                        <textarea id="consignee_addr" class="input-field text-xs" rows="2" placeholder="ที่อยู่ผู้รับ..."></textarea>
                    </div>
                </div>
            </div>

            <div class="input-card">
                <h3 class="text-gray-700 font-bold mb-3">TRANSPORT DETAILS</h3>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <div>
                        <label class="label-text">บ.รับงาน (Carrier)</label>
                        <input type="text" id="carrier" class="input-field">
                    </div>
                    <div>
                        <label class="label-text">ทะเบียนรถ (Truck No.)</label>
                        <input type="text" id="truck_no" class="input-field">
                    </div>
                    <div>
                        <label class="label-text">พนักงานขับรถ (Driver)</label>
                        <input type="text" id="driver" class="input-field">
                    </div>
                    <div>
                        <label class="label-text">ปลายทาง (Destination)</label>
                        <input type="text" id="dest" class="input-field">
                    </div>
                </div>
            </div>

            <div class="input-card overflow-x-auto">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-gray-700 font-bold">ITEM LIST (รายละเอียดสินค้า)</h3>
                    <button type="button" onclick="addRow()" class="text-blue-600 text-sm font-bold">+ เพิ่มแถว</button>
                </div>
                <table class="w-full text-sm" id="itemTable">
                    <thead>
                        <tr class="text-left text-gray-400 border-b">
                            <th class="pb-2 w-16">No.</th>
                            <th class="pb-2">Description of Goods</th>
                            <th class="pb-2 w-32 text-right">Qty (Pcs)</th>
                            <th class="pb-2 w-32 text-right">Package</th>
                            <th class="pb-2 w-10"></th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100">
                        <tr>
                            <td class="py-3">1</td>
                            <td class="py-3"><input type="text" class="input-field item-desc" placeholder="เช่น FRESH DURIAN"></td>
                            <td class="py-3 text-right"><input type="number" class="input-field text-right item-qty" value="0"></td>
                            <td class="py-3 text-right"><input type="text" class="input-field text-right item-pkg" placeholder="CARTONS"></td>
                            <td class="py-3 text-center"></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="input-card">
                <label class="label-text">REMARKS / หมายเหตุ</label>
                <textarea id="remarks" class="input-field" rows="2"></textarea>
            </div>
        </form>
    </div>

    <script>
        // Set default date
        document.getElementById('doc_date').valueAsDate = new Date();

        function addRow() {
            const table = document.getElementById('itemTable').getElementsByTagName('tbody')[0];
            const rowCount = table.rows.length + 1;
            const row = table.insertRow();
            row.innerHTML = `
                <td class="py-3">${rowCount}</td>
                <td class="py-3"><input type="text" class="input-field item-desc"></td>
                <td class="py-3 text-right"><input type="number" class="input-field text-right item-qty" value="0"></td>
                <td class="py-3 text-right"><input type="text" class="input-field text-right item-pkg"></td>
                <td class="py-3 text-center"><button type="button" onclick="this.parentElement.parentElement.remove()" class="text-red-400">✕</button></td>
            `;
        }

        async function generatePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('p', 'mm', 'a4');
            
            // --- DATA COLLECTION ---
            const rn = document.getElementById('rn_no').value || 'N/A';
            const date = document.getElementById('doc_date').value;
            const container = document.getElementById('container_no').value || '-';
            
            // --- PDF STYLING & GENERATION ---
            // Header Section
            doc.setFontSize(22);
            doc.setTextColor(40);
            doc.text("WORK ORDER / INVOICE", 105, 20, { align: "center" });
            
            doc.setFontSize(10);
            doc.text(`RN NO: ${rn}`, 15, 30);
            doc.text(`DATE: ${date}`, 195, 30, { align: "right" });
            doc.line(15, 33, 195, 33);

            // Shipper & Consignee Box
            doc.setFont(undefined, 'bold');
            doc.text("SHIPPER:", 15, 42);
            doc.text("CONSIGNEE:", 110, 42);
            
            doc.setFont(undefined, 'normal');
            doc.setFontSize(9);
            // Shipper Info
            const sName = document.getElementById('shipper_name').value;
            const sAddr = document.getElementById('shipper_addr').value;
            doc.text(sName, 15, 48, { maxWidth: 80 });
            doc.text(sAddr, 15, 53, { maxWidth: 80 });

            // Consignee Info
            const cName = document.getElementById('consignee_name').value;
            const cAddr = document.getElementById('consignee_addr').value;
            doc.text(cName, 110, 48, { maxWidth: 85 });
            doc.text(cAddr, 110, 53, { maxWidth: 85 });

            // Transport Info Row
            doc.setFillColor(245, 245, 245);
            doc.rect(15, 75, 180, 15, 'F');
            doc.setFontSize(8); doc.setTextColor(100);
            doc.text("CONTAINER NO.", 20, 80);
            doc.text("CARRIER", 70, 80);
            doc.text("TRUCK / DRIVER", 120, 80);
            doc.text("DESTINATION", 160, 80);

            doc.setFontSize(10); doc.setTextColor(0); doc.setFont(undefined, 'bold');
            doc.text(container, 20, 86);
            doc.text(document.getElementById('carrier').value, 70, 86);
            doc.text(`${document.getElementById('truck_no').value} / ${document.getElementById('driver').value}`, 120, 86);
            doc.text(document.getElementById('dest').value, 160, 86);

            // Item Table
            const items = [];
            const rows = document.querySelectorAll('#itemTable tbody tr');
            rows.forEach((row, index) => {
                const desc = row.querySelector('.item-desc').value;
                const qty = row.querySelector('.item-qty').value;
                const pkg = row.querySelector('.item-pkg').value;
                if(desc) items.push([index + 1, desc, qty, pkg]);
            });

            doc.autoTable({
                startY: 95,
                head: [['NO.', 'DESCRIPTION OF GOODS', 'QUANTITY', 'PACKAGE']],
                body: items,
                theme: 'grid',
                headStyles: { fillColor: [30, 58, 138], halign: 'center' },
                columnStyles: { 
                    0: { cellWidth: 15, halign: 'center' },
                    2: { cellWidth: 30, halign: 'right' },
                    3: { cellWidth: 40, halign: 'center' }
                },
                styles: { font: 'Sarabun', fontSize: 9 }
            });

            // Footer / Signatures
            let finalY = doc.lastAutoTable.finalY + 20;
            if (finalY > 250) { doc.addPage(); finalY = 20; }

            doc.setFontSize(10); doc.setFont(undefined, 'bold');
            doc.text("REMARKS:", 15, finalY);
            doc.setFont(undefined, 'normal');
            doc.text(document.getElementById('remarks').value, 15, finalY + 5, { maxWidth: 180 });

            const sigY = finalY + 40;
            doc.line(20, sigY, 80, sigY);
            doc.text("AUTHORIZED SIGNATORY", 30, sigY + 5);
            
            doc.line(130, sigY, 190, sigY);
            doc.text("DRIVER SIGNATURE", 145, sigY + 5);

            // Save
            doc.save(`SPM_WorkOrder_${rn}.pdf`);
        }
    </script>
</body>
</html>
